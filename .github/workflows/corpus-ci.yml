name: corpus-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  trust-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema indic-transliteration pytest numpy
      - name: Deivathin Kural semantic hardening
        run: make dk-semantic-hardening-gate
      - name: Mahaperiyava evidence-depth authority gate
        run: make mahaperiyava-evidence-depth-gate
      - name: Mahaperiyava external source-family evidence gate
        run: make mahaperiyava-external-source-gate
      - name: Mahaperiyava external-to-DK crosslink gate
        run: make mahaperiyava-external-crosslink-gate
      - name: Mahaperiyava external evidence adjudication gate
        run: make mahaperiyava-external-adjudication-gate
      - name: Mahaperiyava archival acquisition gate
        run: make mahaperiyava-archival-acquisition-gate
      - name: Mahaperiyava 1962 Tamil visual witness gate
        run: make mahaperiyava-1962-tamil-visual-gate
      - name: Mahaperiyava 1968 Preceptors evidence-depth gate
        run: make mahaperiyava-1968-preceptors-promotion-gate
      - name: Mahaperiyava 1963 interview artifact gate
        run: make mahaperiyava-1963-interview-artifact-gate
      - name: Mahaperiyava 1963 interview proposition gate
        run: make mahaperiyava-1963-proposition-gate
      - name: Mahaperiyava 1963 interview adjudication gate
        run: make mahaperiyava-1963-adjudication-gate
      - name: Mahaperiyava 1963 item-level promotion gate
        run: make mahaperiyava-1963-promotion-gate
      - name: Mahaperiyava V1-V7 retrieval foundation
        run: make mahaperiyava-retrieval-gate
      - name: Mahaperiyava multilingual hybrid retrieval structure gate
        run: make mahaperiyava-hybrid-retrieval-structure-gate
      - name: Mahaperiyava grounded answer backend
        run: make mahaperiyava-grounded-answer-gate
      - name: Mahaperiyava mobile-first product UI
        run: make mahaperiyava-product-ui-gate
      - name: Mahaperiyava Hugging Face release hardening
        run: make mahaperiyava-hf-release-gate
      - name: Moat/trust gates
        run: make moat-proof-gate
      - name: Build file-level rights matrix
        run: python scripts/build_license_matrix.py
      - name: Test rights-aware release builder
        run: python tests/test_release_builder.py
      - name: Build research-NC candidate
        run: |
          python scripts/build_release.py --profile research-nc --outdir dist/research-nc
          python scripts/check_release.py dist/research-nc
      - name: Build open candidate
        run: |
          python scripts/build_release.py --profile open --outdir dist/open
          python scripts/check_release.py dist/open
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-release-candidates
          path: dist/
